<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tip Havuzu</title>
    <link rel="stylesheet" href="/static/tip.modern.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='utilities.css') }}">
</head>
<body>
    <div class="page-actions">
        <a href="/dashboard" class="page-action-back">&#8592; Geri</a>
        <a href="/logout" class="page-action-exit">&#199;&#305;k&#305;&#351;</a>
    </div>

    <div class="container">
        <div class="page-header">
            <div class="page-title">
                <div class="page-badge">&#128176;</div>
                <div>
                    <div class="title">Tip Havuzu Dagitimi</div>
                    <div class="subtitle">Donem, gun ve odeme dagilimini yonetin.</div>
                </div>
            </div>
            <div class="header-actions">
                <a href="/kasa" class="btn btn-secondary">&#8592; Kasa</a>
            </div>
        </div>

        <div class="card control-card">
            <div class="control-grid">
                <div class="field-block">
                    <label for="period-start">Baslangic</label>
                    <input type="date" id="period-start" class="field-input">
                </div>
                <div class="field-block">
                    <label for="period-end">Bitis</label>
                    <input type="date" id="period-end" class="field-input">
                </div>
                <div class="field-block tip-total">
                    <label for="tip-total">Toplam Tip</label>
                    <div class="tip-input">
                        <input type="number" id="tip-total" min="0" step="0.01" value="0">
                        <span class="tip-suffix">TL</span>
                    </div>
                </div>
                <div class="actions-block">
                    <button class="btn btn-secondary" onclick="loadPeriod()">Donemi Yukle</button>
                    <button class="btn btn-secondary" onclick="loadWorkdaysFromAttendance()">Gunleri Getir</button>
                    <button class="btn btn-primary" onclick="calculatePayouts()">Hesapla</button>
                    <button class="btn btn-success" onclick="savePeriod()">Kaydet</button>
                </div>
            </div>
            <div class="hint">Varsayilan donem: bu haftanin Pazartesi-Pazar araligi. Istersen tarihleri degistirebilirsin.</div>
        </div>

        <div class="cards-grid">
            <div class="card list-card">
                <div class="card-header">
                    <h3>Garson Gunleri</h3>
                    <button class="btn btn-primary" onclick="addRow()">+ Garson Ekle</button>
                </div>
                <div class="rows" id="waiter-rows"></div>
            </div>

            <div class="card result-card">
                <div class="card-header">
                    <h3>Dagitim Sonuclari</h3>
                </div>
                <div class="summary">
                    <div class="summary-item">
                        <span>Toplam Tip</span>
                        <strong id="summary-total">0 TL</strong>
                    </div>
                    <div class="summary-item">
                        <span>Toplam Gun</span>
                        <strong id="summary-days">0</strong>
                    </div>
                </div>
                <div class="results" id="payout-rows"></div>
            </div>
        </div>
    </div>

    <script>
        function startOfWeek(date) {
            const day = date.getDay();
            const diff = (day === 0 ? -6 : 1 - day);
            const d = new Date(date);
            d.setDate(date.getDate() + diff);
            return d;
        }

        function endOfWeek(date) {
            const start = startOfWeek(date);
            const d = new Date(start);
            d.setDate(start.getDate() + 6);
            return d;
        }

        function formatDateInput(date) {
            const y = date.getFullYear();
            const m = String(date.getMonth() + 1).padStart(2, '0');
            const d = String(date.getDate()).padStart(2, '0');
            return `${y}-${m}-${d}`;
        }

        function setDefaultWeek() {
            const now = new Date();
            document.getElementById('period-start').value = formatDateInput(startOfWeek(now));
            document.getElementById('period-end').value = formatDateInput(endOfWeek(now));
        }

        function addRow(name = '', days = 0) {
            const tbody = document.getElementById('waiter-rows');
            const row = document.createElement('div');
            row.className = 'row';
            row.innerHTML = `
                <input type="text" class="waiter-name" value="${name}" placeholder="Garson adi">
                <input type="number" class="waiter-days" min="0" step="1" value="${days}">
                <button class="btn btn-secondary" onclick="removeRow(this)">Sil</button>
            `;
            tbody.appendChild(row);
        }

        function removeRow(btn) {
            btn.closest('.row').remove();
        }

        function collectWorkdays() {
            const names = Array.from(document.querySelectorAll('.waiter-name'));
            const days = Array.from(document.querySelectorAll('.waiter-days'));
            const workdays = {};
            names.forEach((input, idx) => {
                const name = input.value.trim();
                if (!name) return;
                const dayVal = parseInt(days[idx].value || '0', 10);
                workdays[name] = isNaN(dayVal) ? 0 : dayVal;
            });
            return workdays;
        }

        function renderPayouts(workdays, payouts) {
            const tbody = document.getElementById('payout-rows');
            tbody.innerHTML = '';
            const entries = Object.keys(workdays);
            let totalDays = 0;
            entries.forEach(name => { totalDays += workdays[name]; });

            entries.forEach(name => {
                const ratio = totalDays > 0 ? (workdays[name] / totalDays) * 100 : 0;
                const row = document.createElement('div');
                row.className = 'result-row';
                row.innerHTML = `
                    <div class="result-left">
                        <div class="result-name">${name}</div>
                        <div class="result-days">${workdays[name]} gun</div>
                    </div>
                    <div class="result-bar">
                        <div class="bar-track">
                            <div class="bar-fill" style="width: ${ratio.toFixed(1)}%"></div>
                        </div>
                    </div>
                    <div class="result-amount">${(payouts[name] || 0).toFixed(2)} TL</div>
                `;
                tbody.appendChild(row);
            });

            document.getElementById('summary-total').textContent = (parseFloat(document.getElementById('tip-total').value || '0')).toFixed(2) + ' TL';
            document.getElementById('summary-days').textContent = totalDays;
        }

        function loadPeriod() {
            const start = document.getElementById('period-start').value;
            const end = document.getElementById('period-end').value;
            if (!start || !end) {
                alert('Lutfen baslangic ve bitis tarihini secin.');
                return;
            }

            fetch(`/api/tip-havuzu?start=${start}&end=${end}`)
                .then(res => res.json())
                .then(data => {
                    if (!data.success) {
                        alert(data.message || 'Veri alinamadi.');
                        return;
                    }
                    const period = data.period;
                    document.getElementById('waiter-rows').innerHTML = '';
                    if (period) {
                        document.getElementById('tip-total').value = period.tip_total || 0;
                        Object.keys(period.workdays || {}).forEach(name => {
                            addRow(name, period.workdays[name]);
                        });
                        renderPayouts(period.workdays || {}, period.payouts || {});
                    } else {
                        document.getElementById('tip-total').value = 0;
                        addRow('', 0);
                        renderPayouts({}, {});
                    }
                })
                .catch(err => {
                    alert('Hata: ' + err.message);
                });
        }

        function loadWorkdaysFromAttendance() {
            const start = document.getElementById('period-start').value;
            const end = document.getElementById('period-end').value;
            if (!start || !end) {
                alert('Lutfen baslangic ve bitis tarihini secin.');
                return;
            }
            fetch(`/api/vardiya/summary?start=${start}&end=${end}`)
                .then(res => res.json())
                .then(data => {
                    if (!data.success) {
                        alert(data.message || 'Veri alinamadi.');
                        return;
                    }
                    const workdays = data.workdays || {};
                    const tbody = document.getElementById('waiter-rows');
                    tbody.innerHTML = '';
                    Object.keys(workdays).forEach(name => {
                        addRow(name, workdays[name]);
                    });
                    calculatePayouts();
                })
                .catch(err => alert('Hata: ' + err.message));
        }

        function calculatePayouts() {
            const tipTotal = parseFloat(document.getElementById('tip-total').value || '0');
            const workdays = collectWorkdays();
            fetch('/api/tip-havuzu/hesapla', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ tip_total: tipTotal, workdays })
            })
            .then(res => res.json())
            .then(data => {
                if (!data.success) {
                    alert(data.message || 'Hesaplama hatasi.');
                    return;
                }
                renderPayouts(workdays, data.payouts || {});
            })
            .catch(err => alert('Hata: ' + err.message));
        }

        function savePeriod() {
            const start = document.getElementById('period-start').value;
            const end = document.getElementById('period-end').value;
            const tipTotal = parseFloat(document.getElementById('tip-total').value || '0');
            const workdays = collectWorkdays();

            fetch('/api/tip-havuzu', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    period_start: start,
                    period_end: end,
                    tip_total: tipTotal,
                    workdays: workdays
                })
            })
            .then(res => res.json())
            .then(data => {
                if (!data.success) {
                    alert(data.message || 'Kaydetme hatasi.');
                    return;
                }
                renderPayouts(data.period.workdays || {}, data.period.payouts || {});
                alert('Tip havuzu kaydedildi.');
            })
            .catch(err => alert('Hata: ' + err.message));
        }

        setDefaultWeek();
        addRow('', 0);
        loadPeriod();
    </script>
</body>
</html>
